<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Computer Modern (shared brand with resume.html — name only) -->
<style>
  @font-face{font-family:'CM Serif';font-weight:normal;font-style:normal;font-display:swap;
    src:url('https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/font/Serif/cmunrm.woff') format('woff');}
  @font-face{font-family:'CM Serif';font-weight:bold;font-style:normal;font-display:swap;
    src:url('https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/font/Serif/cmunbx.woff') format('woff');}

  :root{
    --paper:#faf8f4; --paper-2:#f1ede4; --ink:#1c1b19; --ink-soft:#5c564d;
    --scarlet:#a6132a; --scarlet-dark:#84101f; --scarlet-tint:rgba(166,19,42,.10);
    --ring:rgba(166,19,42,.22);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:'CM Serif',Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--ink);font-family:var(--sans);
    background:radial-gradient(ellipse 90% 60% at 50% -8%,#fffdf9 0%,var(--paper) 60%);
    display:flex;align-items:center;justify-content:center;padding:32px 20px;
    position:relative;overflow:hidden}

  .bg-glyph{position:fixed;top:-12%;right:-8%;font-family:var(--serif);font-weight:bold;
    font-size:min(76vw,660px);line-height:1;color:var(--scarlet);opacity:.055;
    transform:rotate(-6deg);pointer-events:none;user-select:none;z-index:0}

  .wrap{position:relative;z-index:1;width:100%;max-width:480px;display:flex;
    flex-direction:column;align-items:center;text-align:center;gap:6px}

  @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .avatar,.name,.tagline,.cta,.social,.source-link{animation:riseIn .55s ease both}
  .name{animation-delay:.05s}
  .tagline{animation-delay:.12s}
  .cta{animation-delay:.2s}
  .social{animation-delay:.28s}
  .source-link{animation-delay:.35s}

  .avatar{width:160px;height:160px;border-radius:50%;overflow:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;background:var(--paper-2);
    box-shadow:0 1px 2px rgba(28,27,25,.06),0 12px 28px rgba(28,27,25,.14),
      0 0 0 1px var(--ring),0 0 0 5px var(--paper);margin-bottom:22px}
  .avatar-img{width:100%;height:100%;object-fit:cover;display:block}
  .avatar-fallback{font-family:var(--serif);font-weight:bold;font-size:2.6em;color:var(--ink-soft);
    letter-spacing:.02em}

  .name{font-family:var(--serif);font-weight:bold;font-size:2.5em;line-height:1.08;margin:0}
  .tagline{font-size:.98em;color:var(--ink-soft);margin:10px 0 30px;letter-spacing:.01em}

  .cta{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;
    gap:9px;background:var(--scarlet);color:#fff;font-weight:600;font-size:1.02em;
    padding:15px 28px;border-radius:11px;box-shadow:0 1px 2px rgba(132,16,31,.25),
      0 10px 24px rgba(132,16,31,.22);transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
  .cta:hover{background:var(--scarlet-dark);transform:translateY(-2px);
    box-shadow:0 1px 2px rgba(132,16,31,.3),0 16px 30px rgba(132,16,31,.28)}
  .cta:active{transform:translateY(0)}
  .cta .arrow{transition:transform .15s ease}
  .cta:hover .arrow{transform:translateX(3px)}
  .cta:focus-visible{outline:2px solid var(--scarlet-dark);outline-offset:3px}

  .social{display:flex;gap:12px;margin-top:34px}
  .icon-btn{all:unset;box-sizing:border-box;cursor:pointer;width:46px;height:46px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    border:1px solid #e3ddd0;color:var(--ink-soft);background:var(--paper);
    transition:transform .15s ease,border-color .15s ease,color .15s ease,background .15s ease}
  .icon-btn svg{width:19px;height:19px}
  .icon-btn:hover{color:var(--scarlet);border-color:var(--scarlet);background:var(--scarlet-tint);
    transform:translateY(-2px)}
  .icon-btn:focus-visible{outline:2px solid var(--scarlet-dark);outline-offset:2px}

  .source-link{margin-top:30px;font-size:.78em;color:var(--ink-soft);opacity:.75;
    text-decoration:none;border-bottom:1px dotted currentColor;font-family:var(--sans)}
  .source-link:hover{opacity:1;color:var(--scarlet)}
  .source-link:focus-visible{outline:2px solid var(--scarlet-dark);outline-offset:3px}

  @media(max-width:420px){
    .name{font-size:2.1em}
    .avatar{width:132px;height:132px}
    .avatar-fallback{font-size:2.2em}
    .cta{padding:14px 22px;font-size:.97em}
    .icon-btn{width:42px;height:42px}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
    .cta:hover,.icon-btn:hover{transform:none}
  }
</style>
</head>
